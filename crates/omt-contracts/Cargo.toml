[package]
name = "omt-contracts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Generated Rust bindings for the OMT JSON-RPC protocol, produced from schema/*.schema.json (single source of truth)."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Pattern-validated string newtypes (HomeId, NodeId, …) generated by typify
# evaluate their JSON Schema `pattern` constraints through regress.
regress = "0.10"

[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "0.8.22"
typify = "0.4"

[dev-dependencies]
jsonschema = "0.33"
