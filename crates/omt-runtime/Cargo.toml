[package]
name = "omt-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The runnable OMT runtime (plan U5): omt-daemon serving JSON-RPC 2.0 over UDS/named pipe with bootstrap election, peer-credential enrollment, per-home serialized mutation queues, and full command dispatch; plus the `omt` operator CLI."

[lib]
name = "omt_runtime"
path = "src/lib.rs"

[[bin]]
name = "omt-daemon"
path = "src/main.rs"

[[bin]]
name = "omt"
path = "src/cli_main.rs"

[dependencies]
omt-client = { path = "../omt-client" }
omt-contracts = { path = "../omt-contracts" }
omt-domain = { path = "../omt-domain" }
omt-storage = { path = "../omt-storage" }
serde = { workspace = true }
serde_json = { workspace = true }
# Peer credentials (SO_PEERCRED / LOCAL_PEERCRED) and SIGTERM/SIGINT handling
# via sigwait cross-platform (unix half; windows transport is cfg-gated).
libc = { workspace = true }
getrandom = { workspace = true }
# Direct SQL reads/writes on the home actor thread (run-plane transactions,
# reindex's dedicated connection).
rusqlite = { workspace = true }
# exec-shim dispatch in the `omt` CLI (design §3.2 / KD-E1). daemon code paths
# never reference this crate (KD-E9; verified by the Task 8 nm check).
omt-exec = { path = "../omt-exec" }

[dev-dependencies]
tempfile = { workspace = true }
# exec_shim.rs rig: write the fake harness into harness/config.json
omt-harness = { path = "../omt-harness" }
