[package]
name = "oh-my-ticket-desktop"
version.workspace = true
edition.workspace = true
description = "oh-my-ticket desktop surface (Tauri 2) — a peer member of the multi-surface runtime (KD4: fresh UI, KD5: same-source sidecar daemon)."

[lib]
name = "oh_my_ticket_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "oh-my-ticket-desktop"
path = "src/main.rs"

[dependencies]
omt-client = { path = "../../../crates/omt-client" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# F-U3-5: stable content hashing for the omp MCP injection's persisted
# workspace/content digests — DefaultHasher's algorithm is not guaranteed
# stable across Rust versions.
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }
