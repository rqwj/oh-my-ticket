[package]
name = "oh-my-ticket-desktop"
version.workspace = true
edition.workspace = true
description = "oh-my-ticket desktop surface (Tauri 2) — a peer member of the multi-surface runtime (KD4: fresh UI, KD5: same-source sidecar daemon)."

[lib]
name = "oh_my_ticket_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "oh-my-ticket-desktop"
path = "src/main.rs"

[dependencies]
omt-client = { path = "../../../crates/omt-client" }
omt-exec = { path = "../../../crates/omt-exec" }
omt-harness = { path = "../../../crates/omt-harness" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# P3-ACC-6：退出 / 关窗确认框直调 NSAlert（「取消」绑定 Esc）。版本与 tauri /
# rfd 已拉进 Cargo.lock 的一致，不引入新版本。
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSView",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
